{% extends 'accounts/base.html' %}

{% block content %}
    <h2>Login</h2>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <!-- {{ form.as_p }} -->
          <p>Username:<input type="text" name="username" required></p>
          <p>Password:<input type="password" name="password" required></p>
        <button type="submit">Login</button>
    </form>
{% endblock %}
